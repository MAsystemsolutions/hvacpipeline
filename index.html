<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HVAC Job Pipeline · Installs & service calls</title>
<meta name="description" content="HVAC Job Pipeline: track installs and service calls in one place, with subcontractor views that hide pricing and a team feed with @mention emails. Live demo with sample data.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%230ea5e9'/><stop offset='1' stop-color='%23f97316'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><circle cx='16' cy='16' r='3' fill='white'/><path d='M16 13c0-5 2-8 5-8 2 0 3 2 1 4l-6 4zM19 16c5 0 8 2 8 5 0 2-2 3-4 1l-4-6zM16 19c0 5-2 8-5 8-2 0-3-2-1-4l6-4zM13 16c-5 0-8-2-8-5 0-2 2-3 4-1l4 6z' fill='white'/></svg>">
<style>
  html, body { margin: 0; height: 100%; background: #0f1f33; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #cbd5e1; }
  .mark { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #0ea5e9, #38bdf8 55%, #f97316); display: grid; place-items: center; }
  .spin { width: 22px; height: 22px; border: 3px solid rgba(56,189,248,.25); border-top-color: #38bdf8; border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #loading a { color: #7dd3fc; font-size: 13px; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity 0.3s; background: #f4f7fa; }
  iframe.ready { opacity: 1; }
</style>
</head>
<body>
  <div id="loading">
    <div class="mark"><svg width="26" height="26" viewBox="0 0 32 32"><circle cx="16" cy="16" r="3" fill="white"/><path d="M16 13c0-5 2-8 5-8 2 0 3 2 1 4l-6 4zM19 16c5 0 8 2 8 5 0 2-2 3-4 1l-4-6zM16 19c0 5-2 8-5 8-2 0-3-2-1-4l6-4zM13 16c-5 0-8-2-8-5 0-2 2-3 4-1l4 6z" fill="white"/></svg></div>
    <div class="spin"></div>
    <div>Opening HVAC Job Pipeline…</div>
    <a id="direct" href="#" target="_blank" rel="noopener">Taking a while? Open the app directly</a>
  </div>

  <iframe id="app" title="HVAC Job Pipeline" allow="clipboard-write"></iframe>

  <script>
    // ⬇️ Paste your Apps Script Web app URL here (Deploy → Manage deployments → copy the URL ending in /exec)
    const APP_URL = 'https://script.google.com/macros/s/AKfycbw5ORpp3CLrcIOPqgg_9JyjPpz_-pbfM2jKyLbNNWmE3xnlfu-vXMMwZjBz6IzapPHF/exec';

    // Pass ?job=JB_0001 through, so links from @mention emails open the right job.
    const job = new URLSearchParams(location.search).get('job');
    const src = APP_URL + (job ? '?job=' + encodeURIComponent(job) : '');

    const frame = document.getElementById('app');
    document.getElementById('direct').href = src;
    if (APP_URL.indexOf('script.google.com') < 0) {
      document.querySelector('#loading div:last-of-type').textContent = 'Almost there: paste your Apps Script /exec link into index.html.';
      document.querySelector('.spin').style.display = 'none';
    } else {
      frame.addEventListener('load', () => frame.classList.add('ready'));
      frame.src = src;
    }
  </script>
</body>
</html>
